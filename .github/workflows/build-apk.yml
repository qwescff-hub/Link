
name: Build ClipForge APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q ClipForge_Project.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -50

      - name: Build APK
        working-directory: extracted/android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-APK
          path: extracted/android/app/build/outputs/apk/debug/app-debug.apk
